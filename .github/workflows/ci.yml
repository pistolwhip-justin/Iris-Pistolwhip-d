name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test NoMlKit debug variant
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and build APK
        run: ./gradlew --no-daemon testNomlkitDebugUnitTest assembleNomlkitDebug

      - name: Verify APK output exists
        run: test -s app/build/outputs/apk/nomlkit/debug/app-nomlkit-debug.apk
